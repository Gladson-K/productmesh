[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "productmesh"
version = "0.2.0"
requires-python = ">=3.10"
description = "Cross-discipline product lifecycle integrity checker for software, firmware, hardware, AI models and release evidence"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "ProductMesh contributors"}]
keywords = ["product-lifecycle", "digital-thread", "sbom", "openapi", "onnx", "embedded", "release-gate"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
dev = ["pytest>=8", "PyYAML>=6"]

[project.scripts]
productmesh = "productmesh.cli:main"

[tool.setuptools.packages.find]
include = ["productmesh*"]

[tool.setuptools.package-data]
productmesh = ["web/*.html"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["BLE001"]
